<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>M7 OS - HUD MILITAR</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <link id="theme-link" rel="stylesheet" href="./css/themes/roxo-neon.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="hud-top-bar">
    <div class="hud-badge">M7 // SYSTEM</div>
    <div class="hud-clock" id="hudClock">00:00:00</div>
    <div class="hud-status">
      <span id="ramUsage">RAM: 42%</span>
      <span class="dot-online"></span>
    </div>
  </header>

  <div class="bg-honeycomb"></div>

  <main class="swipe-container" id="swipeContainer">

    <section class="tab-page" id="tabFeed">
      <div class="reels-wrapper" id="reelsContainer">
        <div class="reel-card">
          <video src="https://assets.mixkit.co/videos/preview/mixkit-cyberpunk-city-street-at-night-40228-large.mp4" loop autoplay muted playsinline></video>
          <div class="reel-overlay-actions">
            <button class="action-btn"><i data-lucide="heart"></i></button>
            <button class="action-btn"><i data-lucide="message-square"></i></button>
            <button class="action-btn"><i data-lucide="bookmark"></i></button>
            <div class="reel-avatar">
              <img src="./downloadfile-131.png" onerror="this.src='https://via.placeholder.com/40'" alt="Avatar">
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="tab-page" id="tabChat">
      <div class="hud-bracket-box">
        <h2 class="hud-title"><i data-lucide="radio"></i> TERMINAL COMMS</h2>
        <div class="chat-list" id="chatList">
          <div class="chat-item">
            <i data-lucide="phone-call" class="neon-icon"></i>
            <div class="chat-info">
              <span class="chat-name">+55 (11) 99999-0000</span>
              <span class="chat-status">LINHA SEGURA // ENCRIPTADA</span>
            </div>
            <span class="chat-read-badge">✓✓</span>
          </div>
        </div>
      </div>
    </section>

    <section class="tab-page" id="tabGamer">
      <div class="hud-bracket-box">
        <h2 class="hud-title"><i data-lucide="gamepad-2"></i> GAME HUB SLOTS</h2>
        <div class="gamer-slots" id="gamerSlots">
          <div class="slot-circle" onclick="launchGame('Free Fire')">FF</div>
          <div class="slot-circle" onclick="launchGame('Delta Force')">DF</div>
          <div class="slot-circle add-slot" id="addGameBtn">+</div>
        </div>
        
        <div class="system-stats">
          <p>CACHE TEMP: <span id="cacheSize">128 MB</span></p>
          <button class="btn-purge" id="purgeBtn"><i data-lucide="flame"></i> EXECUTAR PURGA</button>
        </div>
      </div>
    </section>

    <section class="tab-page" id="tabMusic">
      <div class="music-arc-reactor">
        <div class="hud-ring-spinner"></div>
        <img src="https://via.placeholder.com/150/a855f7/ffffff?text=M7+AUDIO" id="albumCover" class="cover-art" alt="Capa">
      </div>

      <div class="trapezoid-player">
        <span class="track-title" id="trackTitle">NENHUMA MÚSICA</span>
        <audio id="mainAudio"></audio>
        <div class="player-controls">
          <label for="musicInput" class="hud-btn"><i data-lucide="folder-plus"></i> Carregar</label>
          <input type="file" id="musicInput" accept="audio/*" multiple hidden>
          <button class="hud-btn" id="btnPlay"><i data-lucide="play"></i> Play/Pause</button>
        </div>
      </div>
    </section>

  </main>

  <nav class="hud-dock">
    <button class="dock-item active" data-tab="0"><i data-lucide="tv"></i></button>
    <button class="dock-item" data-tab="1"><i data-lucide="message-square"></i></button>
    <button class="dock-item" data-tab="2"><i data-lucide="gamepad-2"></i></button>
    <button class="dock-item" data-tab="3"><i data-lucide="disc"></i></button>
    <button class="dock-item" id="btnPermissions"><i data-lucide="shield-check"></i></button>
  </nav>

  <script src="./js/app.js"></script>
  <script src="./js/swipe-navigation.js"></script>
  <script src="./js/feed-reels.js"></script>
  <script src="./js/chat.js"></script>
  <script src="./js/gamer.js"></script>
  <script src="./js/gravador.js"></script>
  <script src="./js/musica.js"></script>
  <script src="./js/equalizador.js"></script>
  <script src="./js/permissao.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
