<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M7</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: #0d1117;
      color: #00f0ff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* HEADER FIXO */
    header {
      background: #161b22;
      border-bottom: 2px solid #00f0ff;
      padding: 15px;
      text-align: center;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }

    header h1 {
      font-size: 18px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 8px #00f0ff;
    }

    /* CONTEÚDO PRINCIPAL (TELAS) */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* MENU DE NAVEGAÇÃO INFERIOR */
    nav {
      background: #161b22;
      border-top: 1px solid #30363d;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }

    nav button {
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: 0.3s;
    }

    nav button.active {
      color: #00f0ff;
      text-shadow: 0 0 8px #00f0ff;
    }

    /* CARDS DE JOGOS E SLOTS */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .game-card {
      background: #161b22;
      border: 1px solid #00f0ff;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .game-card:active {
      transform: scale(0.95);
    }

    .game-card-add {
      background: rgba(0, 240, 255, 0.05);
      border: 2px dashed #00f0ff;
    }

    /* PLAYER DE MÍDIA */
    .media-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }

    ul.playlist {
      list-style: none;
      margin-top: 10px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid #21262d;
      border-radius: 5px;
    }

    ul.playlist li {
      padding: 10px;
      border-bottom: 1px solid #21262d;
      font-size: 11px;
      color: #c9d1d9;
      cursor: pointer;
    }

    /* MODAL DE PERMISSÕES */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #161b22;
      border: 1px solid #00f0ff;
      border-radius: 10px;
      width: 85%;
      max-width: 320px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }

    .btn-neon {
      background: #00f0ff;
      color: #000;
      border: none;
      padding: 12px 20px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 11px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h1>M7 // SYSTEM</h1>
  </header>

  <main>
    <section id="tab-gamer" class="tab-content active">
      <h3 style="font-size: 14px; border-bottom: 1px solid #30363d; padding-bottom: 5px;">// GAME LAUNCHER</h3>
      
      <div class="game-grid" id="gameGrid">
        <div class="game-card" onclick="launchApp('com.dts.freefireth')">
          <div style="font-size: 28px;">🔥</div>
          <div style="color: #fff; font-weight: bold; font-size: 12px; margin-top: 5px;">Free Fire</div>
          <div style="color: #3fb950; font-size: 9px; margin-top: 3px;">● Executar</div>
        </div>

        <div class="game-card" onclick="launchApp('com.proxima.deltaforce')">
          <div style="font-size: 28px;">🎯</div>
          <div style="color: #fff; font-weight: bold; font-size: 12px; margin-top: 5px;">Delta Force</div>
          <div style="color: #3fb950; font-size: 9px; margin-top: 3px;">● Executar</div>
        </div>

        <div class="game-card game-card-add" onclick="addNewGameSlot()">
          <div style="font-size: 28px; color: #00f0ff;">+</div>
          <div style="color: #00f0ff; font-size: 10px; font-weight: bold;">NOVO SLOT</div>
        </div>

        <div class="game-card game-card-add" onclick="addNewGameSlot()">
          <div style="font-size: 28px; color: #00f0ff;">+</div>
          <div style="color: #00f0ff; font-size: 10px; font-weight: bold;">NOVO SLOT</div>
        </div>
      </div>

      <div style="margin-top: 25px;">
        <button class="btn-neon" onclick="startPermissionFlow()">🛡️ Configurar Permissões do Sistema</button>
      </div>
    </section>

    <section id="tab-musicas" class="tab-content">
      <h3 style="font-size: 14px; border-bottom: 1px solid #30363d; padding-bottom: 5px;">// HUB DE MÍDIA OFFLINE</h3>
      
      <div class="media-box" style="text-align: center;">
        <input type="file" id="mediaInput" accept="audio/*,video/*" multiple style="display:none;" onchange="m7Player.loadFiles(event)">
        <button class="btn-neon" onclick="document.getElementById('mediaInput').click()">📂 Carregar Músicas/Vídeos</button>
      </div>

      <div class="media-box">
        <div id="trackTitle" style="color: #fff; font-weight: bold; font-size: 12px; margin-bottom: 8px;">Nenhuma faixa tocando</div>
        <audio id="mainAudio" controls style="width: 100%; filter: invert(90%);"></audio>
      </div>

      <div class="media-box">
        <span style="color: #58a6ff; font-size: 11px; font-weight: bold;">PLAYLIST LOCAL</span>
        <ul id="playlist" class="playlist">
          <li style="text-align: center; color: #8b949e;">Nenhum arquivo selecionado.</li>
        </ul>
      </div>
    </section>

    <section id="tab-mensagens" class="tab-content">
      <h3 style="font-size: 14px; border-bottom: 1px solid #30363d; padding-bottom: 5px;">// CENTRAL M7</h3>
      <p style="color: #8b949e; font-size: 12px; margin-top: 10px;">Status da memória offline: <strong style="color: #3fb950;">ATIVO (Cache PWA)</strong></p>
    </section>
  </main>

  <nav>
    <button class="nav-btn active" onclick="switchTab('tab-gamer', this)">
      <span>🕹️</span> Hub Gamer
    </button>
    <button class="nav-btn" onclick="switchTab('tab-musicas', this)">
      <span>🎵</span> Músicas
    </button>
    <button class="nav-btn" onclick="switchTab('tab-mensagens', this)">
      <span>💬</span> M7 System
    </button>
  </nav>

  <div id="permissionModal" class="modal-overlay">
    <div class="modal-card">
      <div id="permIcon" style="font-size: 32px; margin-bottom: 10px;">🎤</div>
      <h4 id="permTitle" style="color: #00f0ff; font-size: 14px; margin-bottom: 8px;">PERMISSÃO DE MICROFONE</h4>
      <p id="permDesc" style="color: #8b949e; font-size: 11px; margin-bottom: 15px; line-height: 1.4;"></p>
      
      <button class="btn-neon" onclick="grantCurrentPermission()" style="margin-bottom: 8px;">Permitir durante o uso</button>
      <button onclick="nextPermissionStep()" style="background: transparent; color: #8b949e; border: 1px solid #30363d; padding: 8px; border-radius: 4px; font-size: 10px; width: 100%; cursor: pointer;">Negar / Pular</button>
    </div>
  </div>

  <script src="./js/media-player.js"></script>
  <script>
    // Troca de Abas
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // Executar Jogos no Android
    function launchApp(packageName) {
      window.location.href = `intent://launch/#Intent;scheme=android-app;package=${packageName};end`;
    }

    function addNewGameSlot() {
      const name = prompt("Nome do aplicativo/jogo:");
      const pkg = prompt("Nome do pacote Android (ex: com.dts.freefireth):");
      if (name && pkg) {
        const grid = document.getElementById('gameGrid');
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => launchApp(pkg);
        card.innerHTML = `<div style="font-size: 28px;">🎮</div><div style="color: #fff; font-weight: bold; font-size: 12px; margin-top: 5px;">${name}</div><div style="color: #3fb950; font-size: 9px; margin-top: 3px;">● Executar</div>`;
        grid.insertBefore(card, grid.children[grid.children.length - 2]);
      }
    }

    // Fluxo de Permissões
    let currentStep = 0;
    const steps = [
      { icon: "🎤", title: "MICROFONE", desc: "Necessário para chamadas de voz e áudio no app.", action: () => navigator.mediaDevices.getUserMedia({ audio: true }) },
      { icon: "📁", title: "FOTOS E MÍDIA", desc: "Necessário para carregar suas músicas e arquivos salvos.", action: () => Promise.resolve() },
      { icon: "📞", title: "TELEFONE", desc: "Necessário para gerenciar áudio durante chamadas de rede.", action: () => Promise.resolve() }
    ];

    function startPermissionFlow() {
      currentStep = 0;
      showStep();
    }

    function showStep() {
      if (currentStep >= steps.length) {
        document.getElementById('permissionModal').style.display = 'none';
        alert('Configuração de permissões concluída!');
        return;
      }
      const step = steps[currentStep];
      document.getElementById('permIcon').textContent = step.icon;
      document.getElementById('permTitle').textContent = `PERMISSÃO DE ${step.title}`;
      document.getElementById('permDesc').textContent = step.desc;
      document.getElementById('permissionModal').style.display = 'flex';
    }

    function grantCurrentPermission() {
      steps[currentStep].action().then(() => nextPermissionStep()).catch(() => nextPermissionStep());
    }

    function nextPermissionStep() {
      currentStep++;
      showStep();
    }

    // Registra Service Worker Offline
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(() => console.log('M7 Offline PRONTO!'));
    }
  </script>
</body>
</html>
